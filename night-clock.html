<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Night Clock">
<title>Night Clock</title>
<style>
  html, body {
    margin: 0; padding: 0; background: #000; overflow: hidden;
    height: 100%; width: 100%; touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }

  #rotator {
    position: fixed; top: 50%; left: 50%;
    width: 100vh; height: 100vw; /* swapped dims for landscape pre-rotation */
    transform-origin: center center;
    transform: translate(-50%, -50%) rotate(90deg);
    background: #000;
  }
  #stage {
    width: 100%; height: 100%; position: relative;
  }

  #clock-wrap {
    position: absolute; inset: max(24px, 3vmin);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  #digits {
    font-family: -apple-system, system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    line-height: 1;
    color: #f00;
    white-space: nowrap;
  }

  #nightlight-overlay {
    position: absolute; inset: 0; background: #fff;
    opacity: 0; z-index: 10; pointer-events: none;
  }
  #dim-overlay {
    position: absolute; inset: 0; background: #000;
    opacity: 0; z-index: 20; pointer-events: none;
  }

  #nightlight-btn, #gear-btn {
    position: absolute; z-index: 30;
    min-width: 44px; min-height: 44px;
    width: 56px; height: 56px;
    border: none; border-radius: 50%;
    background: rgba(255,255,255,0.08);
    color: #f00;
    font-size: 26px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    opacity: 0.35;
    -webkit-tap-highlight-color: transparent;
    padding: 0;
  }
  #nightlight-btn:active, #gear-btn:active,
  #nightlight-btn:focus, #gear-btn:focus {
    opacity: 1;
  }
  #nightlight-btn { bottom: 10px; left: 10px; }
  #gear-btn { top: 10px; right: 10px; }

  #settings-sheet {
    position: absolute; inset: 0; z-index: 40;
    background: rgba(0,0,0,0.92);
    display: flex; align-items: center; justify-content: center;
  }
  #settings-sheet[hidden] { display: none; }
  #settings-panel {
    background: #111; border: 1px solid #400;
    border-radius: 12px; padding: 20px 24px;
    width: min(86%, 520px); max-height: 90%; overflow-y: auto;
    color: #f00; font-family: -apple-system, system-ui, sans-serif;
  }
  #settings-panel h2 {
    margin: 0 0 8px; font-size: 20px; color: #f00;
  }
  .toggle-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 4px; border-bottom: 1px solid #300;
    font-size: 17px;
  }
  .toggle-row label.text { flex: 1; padding-right: 12px; color: #f00; }
  .toggle { position: relative; width: 74px; height: 44px; flex: 0 0 auto; }
  .toggle input[type="checkbox"] {
    appearance: none; -webkit-appearance: none;
    width: 74px; height: 44px; margin: 0;
    background: #442222; border-radius: 22px;
    position: relative; cursor: pointer; outline: none;
    display: block;
  }
  .toggle input[type="checkbox"]:checked { background: #a00000; }
  .toggle .thumb {
    position: absolute; top: 4px; left: 4px;
    width: 36px; height: 36px; border-radius: 50%;
    background: #fff; pointer-events: none;
    transition: transform 0.15s ease;
  }
  .toggle input[type="checkbox"]:checked ~ .thumb {
    transform: translateX(30px);
  }
  .select-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 4px; border-bottom: 1px solid #300; font-size: 17px;
  }
  .select-row select {
    background: #221010; color: #f00; border: 1px solid #500;
    border-radius: 6px; font-size: 16px; padding: 6px 8px;
  }
  #done-btn {
    margin-top: 18px; width: 100%; min-height: 48px;
    background: #a00000; color: #fff; border: none; border-radius: 8px;
    font-size: 18px; font-weight: 700;
  }
</style>
</head>
<body>
  <div id="rotator">
    <div id="stage">
      <div id="clock-wrap"><span id="digits"></span></div>
      <div id="nightlight-overlay"></div>
      <div id="dim-overlay"></div>
      <button id="nightlight-btn" aria-label="Nightlight">&#9789;</button>
      <button id="gear-btn" aria-label="Settings">&#9881;</button>

      <div id="settings-sheet" hidden>
        <div id="settings-panel">
          <h2>Settings</h2>

          <div class="toggle-row">
            <label class="text" for="opt-hour12">12-hour clock</label>
            <span class="toggle">
              <input type="checkbox" id="opt-hour12">
              <span class="thumb"></span>
            </span>
          </div>

          <div class="toggle-row">
            <label class="text" for="opt-seconds">Show seconds</label>
            <span class="toggle">
              <input type="checkbox" id="opt-seconds">
              <span class="thumb"></span>
            </span>
          </div>

          <div class="toggle-row">
            <label class="text" for="opt-lead-zero">Remove leading zero</label>
            <span class="toggle">
              <input type="checkbox" id="opt-lead-zero">
              <span class="thumb"></span>
            </span>
          </div>

          <div class="toggle-row">
            <label class="text" for="opt-colon">Remove colon</label>
            <span class="toggle">
              <input type="checkbox" id="opt-colon">
              <span class="thumb"></span>
            </span>
          </div>

          <div class="select-row">
            <label for="opt-nightlight-minutes">Nightlight duration</label>
            <select id="opt-nightlight-minutes">
              <option value="1">1 min</option>
              <option value="5">5 min</option>
              <option value="10">10 min</option>
              <option value="15">15 min</option>
              <option value="20">20 min</option>
              <option value="30">30 min</option>
              <option value="60">60 min</option>
            </select>
          </div>

          <div class="toggle-row">
            <label class="text" for="opt-flip">Flip landscape direction</label>
            <span class="toggle">
              <input type="checkbox" id="opt-flip">
              <span class="thumb"></span>
            </span>
          </div>

          <button id="done-btn">Done</button>
        </div>
      </div>
    </div>
  </div>

<script>
(function () {
  'use strict';

  // ---------------------------------------------------------------------
  // 3.1 Settings
  // ---------------------------------------------------------------------
  const DEFAULT_SETTINGS = {
    hour12: true,
    showSeconds: false,
    removeLeadingZero: false,
    removeColon: false,
    nightlightMinutes: 15,
    flipDirection: 'cw' // 'cw' -> rotate(90deg), 'ccw' -> rotate(-90deg)
  };
  const SETTINGS_KEY = 'nightclock.settings.v1';
  let settings = Object.assign({}, DEFAULT_SETTINGS);

  function loadSettings() {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}'); }
    catch (e) { saved = {}; }
    settings = Object.assign({}, DEFAULT_SETTINGS, saved);
    // Sanitize nightlightMinutes: a non-numeric/zero/negative value stored
    // (or injected via a corrupted saved blob) would make durMs NaN or 0,
    // and since nightlightFrame only terminates via `p >= 1`, a NaN/±Infinity
    // p would leave the nightlight rAF loop running forever.
    const n = Number(settings.nightlightMinutes);
    settings.nightlightMinutes = (isFinite(n) && n > 0) ? n : DEFAULT_SETTINGS.nightlightMinutes;
  }
  function saveSettings() {
    try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }
    catch (e) { /* storage unavailable — settings just won't persist */ }
  }

  // ---------------------------------------------------------------------
  // 3.2 Time-format builder (pure function)
  // ---------------------------------------------------------------------
  function buildTimeString(date, s) {
    let h = date.getHours();
    let displayHour = s.hour12 ? (h % 12 || 12) : h;
    let hourStr = String(displayHour).padStart(2, '0');
    if (s.removeLeadingZero && hourStr[0] === '0') hourStr = hourStr.slice(1);
    const minStr = String(date.getMinutes()).padStart(2, '0');
    const sep = s.removeColon ? '' : ':';
    let out = hourStr + sep + minStr;
    if (s.showSeconds) out += sep + String(date.getSeconds()).padStart(2, '0');
    return out;
  }

  // ---------------------------------------------------------------------
  // DOM refs
  // ---------------------------------------------------------------------
  const rotator = document.getElementById('rotator');
  const stage = document.getElementById('stage');
  const clockWrap = document.getElementById('clock-wrap');
  const digitsEl = document.getElementById('digits');
  const nightlightOverlay = document.getElementById('nightlight-overlay');
  const dimOverlay = document.getElementById('dim-overlay');
  const nightlightBtn = document.getElementById('nightlight-btn');
  const gearBtn = document.getElementById('gear-btn');
  const settingsSheet = document.getElementById('settings-sheet');
  const doneBtn = document.getElementById('done-btn');

  const optHour12 = document.getElementById('opt-hour12');
  const optSeconds = document.getElementById('opt-seconds');
  const optLeadZero = document.getElementById('opt-lead-zero');
  const optColon = document.getElementById('opt-colon');
  const optNightlightMinutes = document.getElementById('opt-nightlight-minutes');
  const optFlip = document.getElementById('opt-flip');

  let settingsOpen = false;
  let manualDim = 0; // not persisted — resets to 0 on fresh load

  // ---------------------------------------------------------------------
  // Rotation
  // ---------------------------------------------------------------------
  function applyFlip() {
    const deg = settings.flipDirection === 'cw' ? 90 : -90;
    rotator.style.transform = 'translate(-50%,-50%) rotate(' + deg + 'deg)';
  }

  // ---------------------------------------------------------------------
  // 3.3 Fit engine (digit sizing) — top priority feature
  // ---------------------------------------------------------------------
  let lastLen = null;
  let forceRefit = true;

  function fitDigits(str) {
    const box = clockWrap.getBoundingClientRect();
    if (box.width === 0 || box.height === 0) {
      // Layout hasn't settled yet (e.g. called before the box has a size) —
      // committing to a search now would lock in a tiny 20px result with
      // nothing left to trigger a retry. Force another attempt shortly.
      forceRefit = true;
      requestAnimationFrame(function () { fitDigits(str); });
      return;
    }
    let lo = 20, hi = Math.max(box.width, box.height) * 3, best = lo;
    for (let i = 0; i < 16; i++) {
      const mid = (lo + hi) / 2;
      digitsEl.style.fontSize = mid + 'px';
      digitsEl.textContent = str; // must set text before measuring
      const r = digitsEl.getBoundingClientRect();
      if (r.width <= box.width * 0.98 && r.height <= box.height * 0.98) { best = mid; lo = mid; }
      else hi = mid;
    }
    digitsEl.style.fontSize = best + 'px';
  }

  function tick() {
    const str = buildTimeString(new Date(), settings);
    if (forceRefit || str.length !== lastLen) {
      fitDigits(str);
      lastLen = str.length;
      forceRefit = false;
    }
    digitsEl.textContent = str;
  }

  // ---------------------------------------------------------------------
  // 3.4 Nightlight state machine
  // ---------------------------------------------------------------------
  let nightlight = { state: 'idle', start: 0, durMs: 0, gen: 0 };

  function startNightlight() {
    let durMs = settings.nightlightMinutes * 60000;
    if (!isFinite(durMs) || durMs <= 0) durMs = DEFAULT_SETTINGS.nightlightMinutes * 60000;
    const gen = (nightlight.gen || 0) + 1;
    nightlight = { state: 'active', start: Date.now(), durMs: durMs, gen: gen };
    requestAnimationFrame(function () { nightlightFrame(gen); });
  }
  function cancelNightlight() {
    nightlight.state = 'idle';
    nightlight.gen = (nightlight.gen || 0) + 1; // invalidate any in-flight rAF frames
    nightlightOverlay.style.opacity = 0;
    digitsEl.style.opacity = 1;
    checkForUpdate();
  }
  function nightlightFrame(gen) {
    // A frame scheduled for a nightlight "session" that has since been
    // cancelled/restarted (e.g. a leftover pre-backgrounding rAF racing the
    // visibilitychange handler's own re-scheduled frame) is stale — bail out
    // as a no-op instead of double-writing opacity or double-cancelling.
    if (nightlight.state !== 'active' || nightlight.gen !== gen) return;
    const p = Math.min(1, (Date.now() - nightlight.start) / nightlight.durMs);
    nightlightOverlay.style.opacity = 1 - p;
    digitsEl.style.opacity = p;
    if (p >= 1) { cancelNightlight(); return; }
    requestAnimationFrame(function () { nightlightFrame(gen); });
  }

  // ---------------------------------------------------------------------
  // 3.6 Gesture handler — rotation-aware math
  // ---------------------------------------------------------------------
  let dimState = null;
  let lastTap = { t: 0, x: 0, y: 0 };

  function isControlTarget(target) {
    return !!(target && target.closest &&
      target.closest('#gear-btn, #nightlight-btn, #settings-sheet'));
  }

  stage.addEventListener('touchstart', function (e) {
    if (isControlTarget(e.target)) return; // buttons/sheet handle their own taps
    if (e.touches.length > 1) return; // multi-touch: a 2nd finger landing near the 1st must not read as a double-tap
    const t = e.touches[0];
    const now = Date.now();
    const isDoubleTap = (now - lastTap.t < 300 && Math.hypot(t.clientX - lastTap.x, t.clientY - lastTap.y) < 30);
    lastTap = { t: now, x: t.clientX, y: t.clientY };

    if (nightlight.state === 'active') {
      // Any tap — single or double — dismisses an active nightlight. Bail
      // out before arming dimState so this same cancelling touch can't also
      // start a drag-dim gesture (e.g. from finger jitter before lift).
      cancelNightlight();
      return;
    }

    if (isDoubleTap) {
      manualDim = 0;
      dimOverlay.style.opacity = 0;
    }
    dimState = { startX: t.clientX, startVal: manualDim };
  }, { passive: true });

  stage.addEventListener('touchmove', function (e) {
    if (!dimState) return;
    const t = e.touches[0];
    const raw = t.clientX - dimState.startX;
    const dragAmount = settings.flipDirection === 'cw' ? -raw : raw;
    const range = window.innerWidth * 0.6;
    manualDim = Math.min(1, Math.max(0, dimState.startVal + dragAmount / range));
    dimOverlay.style.opacity = manualDim;
  }, { passive: true });

  stage.addEventListener('touchend', function () { dimState = null; }, { passive: true });
  stage.addEventListener('touchcancel', function () { dimState = null; }, { passive: true });

  // Classic iOS Safari fix: a no-op document-level touchstart listener
  // enables the :active CSS pseudo-class on tapped elements (buttons).
  document.addEventListener('touchstart', function () {}, { passive: true });

  // ---------------------------------------------------------------------
  // 3.7 Wake Lock
  // ---------------------------------------------------------------------
  let wakeLock = null;
  async function acquireWakeLock() {
    try {
      if (!('wakeLock' in navigator)) return;
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', function () { wakeLock = null; });
    } catch (e) { /* ignore — e.g. not supported, or page not visible */ }
  }

  // ---------------------------------------------------------------------
  // 3.8 Version check / forced reload
  //
  // IMPORTANT: whoever edits this file for a new deploy MUST bump BOTH
  // the APP_VERSION constant below AND the "version" field in
  // version.json to the same new string (e.g. a new date+counter, like
  // "2026-08-29.1"). If these two values ever go out of sync on GitHub,
  // JP's phone will either never notice the update or will reload in a
  // loop, so keep them identical on every deploy.
  // ---------------------------------------------------------------------
  const APP_VERSION = "2026-08-28.1"; // MUST match version.json's "version" field

  async function checkForUpdate() {
    if (settingsOpen || nightlight.state === 'active') return;
    try {
      const res = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) return;
      const data = await res.json();
      const version = data.version;
      if (version && version !== APP_VERSION) {
        // Circuit breaker: if we already reloaded with this exact target
        // version (its "v" query param) and APP_VERSION is still stale,
        // the HTML deploy is lagging/broken — reassigning location.href
        // again would just reload the same broken page forever. Stop.
        const alreadyTried = new URL(location.href).searchParams.get('v') === version;
        if (alreadyTried) return;
        const url = new URL(location.href);
        url.searchParams.set('v', version);
        location.href = url.toString();
      }
    } catch (e) { /* offline — retry on next trigger */ }
  }

  function onSettingsClose() {
    settingsOpen = false;
    checkForUpdate();
  }

  // ---------------------------------------------------------------------
  // Settings sheet wiring
  // ---------------------------------------------------------------------
  function reflectSettingsToUI() {
    optHour12.checked = !!settings.hour12;
    optSeconds.checked = !!settings.showSeconds;
    optLeadZero.checked = !!settings.removeLeadingZero;
    optColon.checked = !!settings.removeColon;
    optNightlightMinutes.value = String(settings.nightlightMinutes);
    optFlip.checked = settings.flipDirection === 'ccw';
  }

  function openSettings() {
    settingsOpen = true;
    reflectSettingsToUI();
    settingsSheet.hidden = false;
  }
  function closeSettings() {
    settingsSheet.hidden = true;
    onSettingsClose();
  }

  gearBtn.addEventListener('click', openSettings);
  doneBtn.addEventListener('click', closeSettings);
  // Tap outside the inner panel (on the sheet backdrop itself) closes it.
  settingsSheet.addEventListener('click', function (e) {
    if (e.target === settingsSheet) closeSettings();
  });

  optHour12.addEventListener('change', function () {
    settings.hour12 = optHour12.checked;
    saveSettings(); forceRefit = true;
  });
  optSeconds.addEventListener('change', function () {
    settings.showSeconds = optSeconds.checked;
    saveSettings(); forceRefit = true;
  });
  optLeadZero.addEventListener('change', function () {
    settings.removeLeadingZero = optLeadZero.checked;
    saveSettings(); forceRefit = true;
  });
  optColon.addEventListener('change', function () {
    settings.removeColon = optColon.checked;
    saveSettings(); forceRefit = true;
  });
  optNightlightMinutes.addEventListener('change', function () {
    settings.nightlightMinutes = parseInt(optNightlightMinutes.value, 10);
    saveSettings();
  });
  optFlip.addEventListener('change', function () {
    settings.flipDirection = optFlip.checked ? 'ccw' : 'cw';
    saveSettings();
    applyFlip();
    forceRefit = true;
  });

  // ---------------------------------------------------------------------
  // Nightlight button
  // ---------------------------------------------------------------------
  nightlightBtn.addEventListener('click', function () {
    if (nightlight.state === 'active') cancelNightlight();
    else startNightlight();
  });

  // ---------------------------------------------------------------------
  // Resize / pageshow — force a re-fit
  // ---------------------------------------------------------------------
  window.addEventListener('resize', function () { forceRefit = true; });
  window.addEventListener('pageshow', function () { forceRefit = true; });

  // ---------------------------------------------------------------------
  // 3.7 / 3.4 visibilitychange — wake lock re-acquire, version check,
  // and nightlight catch-up if progress passed 1 while backgrounded.
  // ---------------------------------------------------------------------
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') {
      acquireWakeLock();
      checkForUpdate();
      if (nightlight.state === 'active') {
        const p = (Date.now() - nightlight.start) / nightlight.durMs;
        if (p >= 1) cancelNightlight();
        else requestAnimationFrame((function (gen) { return function () { nightlightFrame(gen); }; })(nightlight.gen));
      }
    }
  });

  window.addEventListener('load', acquireWakeLock);
  window.addEventListener('load', function () { setTimeout(checkForUpdate, 2000); });
  setInterval(checkForUpdate, 5 * 60 * 1000);

  // ---------------------------------------------------------------------
  // 3.9 Init
  // ---------------------------------------------------------------------
  document.addEventListener('DOMContentLoaded', function () {
    loadSettings();
    applyFlip();
    reflectSettingsToUI();

    requestAnimationFrame(function () {
      forceRefit = true;
      tick();
    });
    setInterval(tick, 200);
    acquireWakeLock();
  });
})();
</script>
</body>
</html>
